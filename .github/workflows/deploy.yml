name: Deploy to GitHub Pages with Secret Injection

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Supabase Credentials
        run: |
          sed -i "s|___SUPABASE_URL_PLACEHOLDER___|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|___SUPABASE_ANON_KEY_PLACEHOLDER___|${{ secrets.SUPABASE_ANON_KEY }}|g" index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
